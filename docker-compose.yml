services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: configurable-digital-human-api:0.1.0
    container_name: configurable-digital-human-api
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_NAME: ${APP_NAME:-configurable-digital-human-api}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CUSTOMER_ID: ${CUSTOMER_ID:-default}
      CUSTOMER_CONFIG_DIR: ${CUSTOMER_CONFIG_DIR:-}
      DEMO_STABLE_MODE: ${DEMO_STABLE_MODE:-}
      CONFIG_ADMIN_TOKEN: ${CONFIG_ADMIN_TOKEN:-}
      CONTROL_PLANE_DB_PATH: ${CONTROL_PLANE_DB_PATH:-/app/data/control-plane.db}
      CONTROL_PLANE_BACKUP_ROOT: ${CONTROL_PLANE_BACKUP_ROOT:-/app/data/control-plane-backups}
      CONTROL_PLANE_ROOT_KEY_B64: ${CONTROL_PLANE_ROOT_KEY_B64:-}
      CONTROL_PLANE_PREVIEW_MODE: ${CONTROL_PLANE_PREVIEW_MODE:-false}
      CONTROL_PLANE_ALLOWED_ORIGINS: ${CONTROL_PLANE_ALLOWED_ORIGINS:-["http://localhost:18000","http://127.0.0.1:18000"]}
      TZ: ${TZ:-Asia/Shanghai}
      DORA_BASE_URL: ${DORA_BASE_URL:-}
      DORA_API_KEY: ${DORA_API_KEY:-}
      DORA_AGENT_ID: ${DORA_AGENT_ID:-}
      DORA_AGENT_NAME: ${DORA_AGENT_NAME:-}
      DORA_CHANNEL_TYPE: ${DORA_CHANNEL_TYPE:-feishu}
      DORA_CHAT_MODE: ${DORA_CHAT_MODE:-sse}
      DORA_TIMEOUT_SECONDS: ${DORA_TIMEOUT_SECONDS:-60}
      RAGFLOW_BASE_URL: ${RAGFLOW_BASE_URL:-}
      RAGFLOW_MCP_URL: ${RAGFLOW_MCP_URL:-}
      RAGFLOW_API_KEY: ${RAGFLOW_API_KEY:-}
      KNOWLEDGE_MODE: ${KNOWLEDGE_MODE:-}
      KNOWLEDGE_RETRIEVAL_TRANSPORT: ${KNOWLEDGE_RETRIEVAL_TRANSPORT:-}
      KNOWLEDGE_DATASET_IDS: ${KNOWLEDGE_DATASET_IDS:-}
      KNOWLEDGE_DATASET_NAME: ${KNOWLEDGE_DATASET_NAME:-}
      KNOWLEDGE_PAGE_SIZE: ${KNOWLEDGE_PAGE_SIZE:-}
      KNOWLEDGE_TOP_K: ${KNOWLEDGE_TOP_K:-}
      KNOWLEDGE_SIMILARITY_THRESHOLD: ${KNOWLEDGE_SIMILARITY_THRESHOLD:-}
      KNOWLEDGE_MAX_CHUNK_CHARS: ${KNOWLEDGE_MAX_CHUNK_CHARS:-}
      KNOWLEDGE_TIMEOUT_SECONDS: ${KNOWLEDGE_TIMEOUT_SECONDS:-}
      KNOWLEDGE_REQUIRE_SOURCES: ${KNOWLEDGE_REQUIRE_SOURCES:-}
      KNOWLEDGE_NO_EVIDENCE_POLICY: ${KNOWLEDGE_NO_EVIDENCE_POLICY:-}
      KNOWLEDGE_FALLBACK_TEXT: ${KNOWLEDGE_FALLBACK_TEXT:-}
      KNOWLEDGE_SUMMARIZER_PROVIDER: ${KNOWLEDGE_SUMMARIZER_PROVIDER:-}
      KNOWLEDGE_SUMMARIZER_PROFILE: ${KNOWLEDGE_SUMMARIZER_PROFILE:-}
      KNOWLEDGE_MAX_ANSWER_CHARS: ${KNOWLEDGE_MAX_ANSWER_CHARS:-}
      FVS_INTEGRATION_MODE: ${FVS_INTEGRATION_MODE:-}
      FVS_URL: ${FVS_URL:-}
      FVS_TARGET_ORIGIN: ${FVS_TARGET_ORIGIN:-}
      VITE_FVS_INTEGRATION_MODE: ${VITE_FVS_INTEGRATION_MODE:-}
      VITE_FVS_URL: ${VITE_FVS_URL:-}
      VITE_FVS_TARGET_ORIGIN: ${VITE_FVS_TARGET_ORIGIN:-}
      ASR_PROVIDER: ${ASR_PROVIDER:-aliyun}
      ASR_API_KEY: ${ASR_API_KEY:-}
      ASR_MODEL: ${ASR_MODEL:-fun-asr-realtime}
      ASR_REGION: ${ASR_REGION:-cn-beijing}
      ASR_WS_URL: ${ASR_WS_URL:-wss://dashscope.aliyuncs.com/api-ws/v1/inference}
      ASR_AUDIO_FORMAT: ${ASR_AUDIO_FORMAT:-wav}
      ASR_SAMPLE_RATE: ${ASR_SAMPLE_RATE:-16000}
      ASR_TIMEOUT_SECONDS: ${ASR_TIMEOUT_SECONDS:-30}
      TTS_PROVIDER: ${TTS_PROVIDER:-aliyun}
      TTS_API_KEY: ${TTS_API_KEY:-}
      TTS_MODEL: ${TTS_MODEL:-cosyvoice-v3-flash}
      TTS_VOICE: ${TTS_VOICE:-longanyang}
      TTS_AUDIO_FORMAT: ${TTS_AUDIO_FORMAT:-mp3}
      TTS_STREAMING_ENABLED: ${TTS_STREAMING_ENABLED:-true}
      TTS_STREAMING_FALLBACK: ${TTS_STREAMING_FALLBACK:-segment}
      TTS_STREAMING_AUDIO_FORMAT: ${TTS_STREAMING_AUDIO_FORMAT:-pcm}
      TTS_WS_URL: ${TTS_WS_URL:-wss://dashscope.aliyuncs.com/api-ws/v1/inference}
      TTS_SAMPLE_RATE: ${TTS_SAMPLE_RATE:-22050}
      TTS_TIMEOUT_SECONDS: ${TTS_TIMEOUT_SECONDS:-30}
      ASK_METRICS_MODE: ${ASK_METRICS_MODE:-}
      SQLITE_PATH: /app/data/sessions.db
      SESSION_LOG_RETENTION_DAYS: ${SESSION_LOG_RETENTION_DAYS:-3}
      TTS_CACHE_DIR: /app/data/tts-cache
      ENABLE_MOCK_DORA: ${ENABLE_MOCK_DORA:-true}
      ENABLE_MOCK_ASR: ${ENABLE_MOCK_ASR:-true}
      ENABLE_MOCK_TTS: ${ENABLE_MOCK_TTS:-true}
      ENABLE_MOCK_FVS: ${ENABLE_MOCK_FVS:-true}
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_PORT:-18080}:18080"
    volumes:
      - ./config:/app/config:ro
      - ./docs/demo_data:/app/docs/demo_data:ro
      - ./data:/app/data
      - ./logs:/app/logs

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:18080}
        VITE_FVS_URL: ${VITE_FVS_URL:-}
        VITE_FVS_INTEGRATION_MODE: ${VITE_FVS_INTEGRATION_MODE:-mock}
        VITE_FVS_TARGET_ORIGIN: ${VITE_FVS_TARGET_ORIGIN:-}
        VITE_DEMO_STABLE_MODE: ${VITE_DEMO_STABLE_MODE:-false}
    image: configurable-digital-human-web:0.1.0
    container_name: configurable-digital-human-web
    depends_on:
      - api
    ports:
      - "${WEB_BIND_HOST:-127.0.0.1}:${WEB_PORT:-18000}:80"
