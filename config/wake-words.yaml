version: 0.1.0
mode: semantic
wake_words:
  - 小智小智
  - 你好小智
settings:
  min_audio_ms: 1000
  max_audio_ms: 6500
  silence_ms: 1000
  cooldown_ms: 800
  command_timeout_ms: 8000
  followup_enabled: true
  followup_window_ms: 12000
  max_followup_turns: 3
  vad_threshold: 0.018
  barge_in_enabled: true
  barge_in_wake_words:
    - 小智小智
    - 你好小智
  barge_in_vad_threshold: 0.018
  barge_in_min_audio_ms: 900
  barge_in_silence_ms: 700
  barge_in_max_audio_ms: 3500
  barge_in_ignore_after_tts_start_ms: 700
  require_exact_phrase: false
notes:
  - 第一阶段使用 VAD + ASR 语义唤醒, 不是严格本地 KWS。
  - 唤醒后开启短时连续对话窗口, 超时或达到轮数后回到唤醒监听。
  - 正式 POC 前需要确认云 ASR 调用和语音数据合规边界。
