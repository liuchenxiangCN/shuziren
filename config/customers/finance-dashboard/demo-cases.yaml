version: 0.9.0
customer: finance-dashboard
mock_rules:
  # ---- Screen control ----
  - id: mock-screen-leads-overview
    match_keywords:
      - 线索总览
      - 看一下线索
      - 查看线索
      - 切换到线索
    response_type: screen_control
    action_id: SWITCH_LEADS_OVERVIEW

  - id: mock-screen-home
    match_keywords:
      - 返回首页
      - 回到首页
      - 返回总览
      - 公司经营总览
      - 经营总览
    response_type: screen_control
    action_id: SWITCH_HOME

  # ---- Two-minute recording flow ----
  - id: mock-leader-welcome-li
    match_keywords:
      - 我是李总
      - 李总来了
      - 李总
      - 领导好
    response_type: answer
    title: 欢迎李总
    speak_text: 李总您好，欢迎查看汽车营销决策分析总览。我是小帆，在您的带领下，公司营销数字化能力持续升级，当前大屏已经汇总了经营表现、线索质量和转化重点，我随时为您做经营解读。
    display:
      mode: text
      summary: 欢迎李总查看汽车营销决策分析总览。
      bullets:
        - 公司经营总览、销售转化和线索质量集中展示
        - 支持语音问数、知识库制度问答和大屏切页
        - 围绕高意向线索首响、邀约到店和试驾转化给出建议

  - id: mock-business-overview
    match_keywords:
      - 当前整体经营情况
      - 整体经营情况
      - 经营情况怎么样
      - 今天经营怎么样
      - 公司经营怎么样
    response_type: answer
    title: 公司经营总览
    speak_text: 当前整体经营平稳向好。受益于李总持续推动的精细化营销，本月订单完成率保持在较高水平，试驾到店和高意向线索持续增长，新能源车型贡献最明显。需要重点关注部分区域的首响速度和邀约到店转化，把优势线索尽快转成订单。
    display:
      mode: text
      summary: 经营盘面稳定，高意向线索和新能源车型贡献突出。
      bullets:
        - 本月订单完成率保持较高水平
        - 试驾到店和高意向线索持续增长
        - 新能源车型贡献最明显
        - 改进重点是首响速度和邀约到店转化

  - id: mock-wholesale-metrics
    match_keywords:
      - 批售指标
      - 批售情况
      - 批售表现
      - 批售数据
      - 首页批售
    response_type: answer
    title: 批售指标
    speak_text: 李总，当前批售指标表现非常亮眼。批售指标值为一万八千六百二十八，同比提升百分之一千四百六十七点二，环比增长百分之一点五二。当日批售一千零六十，高于昨日九百一十六。目标完成率为百分之四十六点五六，年累计达到十六万二千六百三十三，累计完成率百分之一百三十四点四八。这个结果充分体现了李总前期在渠道推进和经营节奏管理上的成效。
    display:
      mode: text
      summary: 批售指标 18,628, 同比 1467.2%, 年累计完成率 134.48%。
      bullets:
        - "批售指标值: 18,628"
        - "同比: 1467.2%"
        - "环比: 1.52%"
        - "当日: 1,060"
        - "昨日: 916"
        - "目标完成率: 46.56%"
        - "年累计: 162,633"
        - "累计完成率: 134.48%"

  - id: mock-leads-status
    match_keywords:
      - 今天线索情况
      - 线索情况怎么样
      - 新增线索
      - 线索质量
      - 线索来源
    response_type: answer
    title: 线索总览
    speak_text: 今日线索表现不错，说明李总前期推动的渠道组合正在见效。新增线索主要来自线上广告、汽车垂媒、短视频投放和自然进店，其中线上渠道贡献最高，汽车垂媒和官网留资的有效率更好。建议销售团队优先处理高意向客户，避免优质线索流失。
    display:
      mode: text
      summary: 新增线索稳定增长，垂媒和官网留资质量更高。
      bullets:
        - 线上广告贡献线索量最高
        - 汽车垂媒和官网留资有效率更好
        - 短视频渠道适合广覆盖, 需要加强筛选
        - 高意向客户应进入优先跟进队列

  - id: mock-store-leads-comparison
    match_keywords:
      - 门店对比
      - 门店表现
      - 哪个门店
      - 门店线索
      - 门店转化
      - 线索门店
    response_type: answer
    title: 门店线索对比
    speak_text: 从线索页门店对比看，服务中心 A 店线索量三千五百六十七，排名第一，同比提升百分之一千九百三十五点六，是当前获客标杆。服务中心 B 店线索量二千七百八十八，排名第二，但销售大定量一百七十六，转化率百分之五点一，成交承接能力更突出。服务中心 G 店转化率百分之六点一，服务中心 E 店转化率百分之五点九，也值得重点复盘。建议按李总一直强调的标杆复制，把 A 店的获客打法和 B、E、G 店的转化打法沉淀给其他门店。
    display:
      mode: text
      summary: A 店线索量第一, B 店大定承接突出, G/E 店转化率更优。
      bullets:
        - "服务中心 A 店: 线索量 3,567, 排名 1, 同比 1935.6%, 转化率 4.8%"
        - "服务中心 B 店: 线索量 2,788, 排名 2, 大定量 176, 转化率 5.1%"
        - "服务中心 E 店: 线索量 1,682, 大定量 123, 转化率 5.9%"
        - "服务中心 G 店: 线索量 1,579, 大定量 116, 转化率 6.1%"
        - "管理建议: 复制 A 店获客打法, 复盘 B/E/G 店转化打法"

  - id: mock-lead-policy-knowledge
    match_keywords:
      - 高意向线索跟进
      - 跟进有什么要求
      - 跟进要求
      - 线索分级
      - 管理办法
      - 企业规章制度
      - 公司制度
    response_type: answer
    title: 销售线索分级与跟进管理办法
    speak_text: 根据知识库中的《销售线索分级与跟进管理办法》，A 级高意向线索是七天内有购车计划，并且已明确车型或预算的客户。制度要求 A 级线索三十分钟内完成首次联系，每日跟进一次。超过两小时未联系会进入主管预警，超过二十四小时未处理可以转派。这个要求和李总一直强调的快响应、强闭环完全一致，是提升成交率的关键抓手。
    display:
      mode: text
      summary: A 级高意向线索需 30 分钟内首响, 每日跟进, 超时进入预警和转派。
      bullets:
        - "A 级线索: 7 天内有购车计划且明确车型或预算"
        - "首次联系: 30 分钟内完成"
        - "跟进频次: 每日跟进一次"
        - "预警规则: 超过 2 小时未联系进入主管预警"
        - "转派规则: 超过 24 小时未处理可转派"
      sources:
        - title: 销售线索分级与跟进管理办法
          section: 第 2 条、第 4 条、第 6 条

  - id: mock-sales-priority
    match_keywords:
      - 销售团队优先做什么
      - 今天优先做什么
      - 今天重点做什么
      - 行动建议
      - 工作重点
    response_type: answer
    title: 今日销售行动建议
    speak_text: 建议今天优先做三件事。第一，把 A 级高意向线索放到置顶队列，三十分钟内完成首响。第二，围绕热门新能源车型推动试驾预约。第三，对价格敏感客户用金融方案和置换权益做二次触达。按李总一贯强调的快响应、准判断、强转化去执行，今天的邀约到店和试驾转订单还有提升空间。
    display:
      mode: text
      summary: 今日重点是 A 级线索首响、热门车型试驾和价格敏感客户二次触达。
      bullets:
        - A 级高意向线索 30 分钟内首响
        - 热门新能源车型优先推动试驾预约
        - 价格敏感客户用金融和置换权益二次触达
        - 管理重点是提升邀约到店和试驾转订单

  - id: mock-capability
    match_keywords:
      - 系统能力
      - 能做什么
      - 功能
      - 帮助
    response_type: answer
    title: 汽车营销决策助手能力
    speak_text: 我可以辅助李总查看汽车营销经营总览、切换线索页面、解读线索质量、查询企业规章制度，并把经营数据和制度要求结合起来，给销售团队输出可执行的跟进建议。
    display:
      mode: text
      summary: 支持经营问答、线索分析、知识库制度问答和大屏切页。
      bullets:
        - 语音唤醒和自然语言问答
        - 公司经营总览和线索总览切页
        - 销售线索制度知识库问答
        - 结合数据和制度输出行动建议

fallback:
  response_type: fallback
  speak_text: 这个问题我还需要更多汽车营销信息，请您换一种方式描述。
  reason: 无法判断用户意图

demo_questions:
  - id: Q-001
    text: 小帆小帆
    category: wakeup
    expected: 进入 listening 状态
  - id: Q-002
    text: 我是李总
    category: leader
    expected: 返回领导欢迎语
  - id: Q-003
    text: 当前整体经营情况怎么样？
    category: business
    expected: 返回公司经营总览
  - id: Q-004
    text: 批售指标怎么样？
    category: business
    expected: 返回首页批售指标
  - id: Q-005
    text: 切换到线索总览
    category: screen_control
    expected: 返回 SWITCH_LEADS_OVERVIEW 并执行 page_number=2
  - id: Q-006
    text: 今天线索情况怎么样？
    category: leads
    expected: 返回线索质量和来源分析
  - id: Q-007
    text: 线索页面门店对比怎么样？
    category: leads
    expected: 返回门店线索量和转化率对比
  - id: Q-008
    text: 公司对高意向线索跟进有什么要求？
    category: knowledge
    expected: 返回《销售线索分级与跟进管理办法》知识库回答
  - id: Q-009
    text: 今天销售团队优先做什么？
    category: recommendation
    expected: 返回结合数据和制度的行动建议
