version: 0.1.0
customer: default
mock_rules:
  - id: mock-screen-org
    match_keywords:
      - 组织建设
      - 成品库存
      - 库存页面
    response_type: screen_control
    action_id: SWITCH_TAB_ORG

  - id: mock-screen-study
    match_keywords:
      - 生产管理
      - 生产页面
      - 生产进度
    response_type: screen_control
    action_id: SWITCH_TAB_STUDY

  - id: mock-screen-activity
    match_keywords:
      - 设备分析
      - 设备页面
      - 设备状态
    response_type: screen_control
    action_id: SWITCH_TAB_ACTIVITY

  - id: mock-screen-home
    match_keywords:
      - 返回首页
      - 回到首页
      - 总览
      - 返回总览
    response_type: screen_control
    action_id: SWITCH_HOME

  - id: mock-guest-welcome
    match_keywords:
      - 演示嘉宾
      - 领导
      - 欢迎
    response_type: answer
    title: 通用欢迎语
    speak_text: 您好，欢迎使用通用可配置数字人。当前系统可通过客户配置切换欢迎语、知识库、问数数据源和大屏动作。
    display:
      mode: text
      summary: 通用数字人项目通过客户配置适配不同场景。
      bullets:
        - 客户名称、助手名称和欢迎语来自配置
        - 知识库、问数数据源和演示问题可替换
        - 大屏动作通过 action_id 白名单执行

  - id: mock-data-summary
    match_keywords:
      - 核心指标
      - 指标概览
      - 数据总结
    response_type: answer
    title: 指标概览
    speak_text: 当前示例指标运行正常。正式项目可通过配置替换为客户自己的数据源和指标口径。
    display:
      mode: text
      summary: 示例指标用于验证问数链路。
      bullets:
        - 问数 Provider 可配置为 Excel、数据库或 Dora
        - 指标口径应写入客户配置
        - 回答需要展示数据来源

  - id: mock-knowledge-capability
    match_keywords:
      - 系统能力
      - 能做什么
      - 项目介绍
    response_type: answer
    title: 系统能力说明
    speak_text: 本项目提供语音唤醒、语音识别、知识问答、指标问数、大屏控屏、语音播报和运维日志能力。
    display:
      mode: text
      summary: 通用数字人能力可通过客户配置组合。
      bullets:
        - 语音唤醒、ASR 和 TTS
        - Dora / 本地 Provider 能力路由
        - RAGFlow 知识库检索和受控回答
        - action_id 白名单大屏控制

fallback:
  response_type: fallback
  speak_text: 这个问题我还需要更多信息，请您换一种方式描述。
  reason: 无法判断用户意图

demo_questions:
  - id: Q-001
    text: 小智小智
    category: wakeup
    expected: 进入 listening 状态
  - id: Q-002
    text: 我是演示嘉宾
    category: welcome
    expected: 返回通用欢迎语
  - id: Q-003
    text: 这个系统能做什么？
    category: knowledge
    expected: 返回系统能力说明
  - id: Q-004
    text: 当前核心指标怎么样？
    category: data
    expected: 返回示例指标概览
  - id: Q-005
    text: 请切换到成品库存页面
    category: screen_control
    expected: 返回 SWITCH_TAB_ORG 并执行
  - id: Q-006
    text: 返回总览
    category: screen_control
    expected: 返回 SWITCH_HOME 并执行
