version: 0.1.0
customer: zt-securities
mock_rules:
  - id: mock-screen-org
    match_keywords:
      - 组织建设
      - 成品库存
      - 库存页面
    response_type: screen_control
    action_id: SWITCH_TAB_ORG

  - id: mock-screen-study
    match_keywords:
      - 党员学习
      - 学习页面
      - 生产管理
      - 生产页面
    response_type: screen_control
    action_id: SWITCH_TAB_STUDY

  - id: mock-screen-activity
    match_keywords:
      - 党建活动
      - 设备分析
      - 设备页面
    response_type: screen_control
    action_id: SWITCH_TAB_ACTIVITY

  - id: mock-screen-home
    match_keywords:
      - 返回首页
      - 回到首页
      - 总览
      - 返回总览
    response_type: screen_control
    action_id: SWITCH_HOME

  - id: mock-leader-zhang
    match_keywords:
      - 张书记
      - 张某某
    response_type: answer
    title: 张书记欢迎语
    speak_text: 张书记您好，欢迎莅临中天证券党建大屏。当前大屏已准备好组织建设和党员学习相关数据。
    display:
      mode: text
      summary: 张书记关注基层党建、党员学习和组织建设。
      bullets:
        - 近期关注基层党建工作
        - 重点关注党员学习完成情况
        - 可继续查看组织建设和党建活动数据

  - id: mock-data-study-rate
    match_keywords:
      - 学习完成率
      - 完成率
    response_type: answer
    title: 党员学习完成率
    speak_text: 当前党员学习完成率为百分之八十七点五，整体学习情况良好。
    display:
      mode: text
      summary: 当前党员学习完成率为 87.5%。
      bullets:
        - 党员总数：128 人
        - 本月学习人数：112 人
        - 学习完成率：87.5%

  - id: mock-knowledge-join-party
    match_keywords:
      - 入党流程
      - 入党
    response_type: answer
    title: 入党流程说明
    speak_text: 入党流程通常包括申请、培养考察、确定发展对象、接收预备党员和转正等环节。
    display:
      mode: text
      summary: 入党流程包含申请、培养、发展、预备和转正等环节。
      bullets:
        - 递交入党申请书
        - 接受培养教育和考察
        - 确定发展对象并履行组织程序
        - 接收为预备党员并按期转正

fallback:
  response_type: fallback
  speak_text: 这个问题我还需要更多信息，请您换一种方式描述。
  reason: 无法判断用户意图

demo_questions:
  - id: Q-001
    text: 小天小天
    category: wakeup
    expected: 进入 listening 状态
  - id: Q-002
    text: 我是张书记
    category: leader
    expected: 返回张书记欢迎语
  - id: Q-003
    text: 入党流程是什么？
    category: knowledge
    expected: 返回入党流程摘要
  - id: Q-004
    text: 当前党员学习完成率是多少？
    category: data
    expected: 返回学习完成率
  - id: Q-005
    text: 请切换到成品库存页面
    category: screen_control
    expected: 返回 SWITCH_TAB_ORG 并执行
  - id: Q-006
    text: 返回总览
    category: screen_control
    expected: 返回 SWITCH_HOME 并执行
