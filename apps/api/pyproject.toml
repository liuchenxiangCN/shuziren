[project]
name = "configurable-digital-human-api"
version = "0.1.0"
description = "Mock gateway API for the local digital human POC."
requires-python = ">=3.12,<3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=45.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "openpyxl>=3.1.5",
    "oracledb>=3.3.0",
    "psycopg[binary]>=3.2.9",
    "pymysql>=1.1.1",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    "sqlalchemy>=2.0.43",
    "sqlglot>=27.12.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=14.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"
